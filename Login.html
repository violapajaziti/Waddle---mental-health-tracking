<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login/Signup</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
   <div class="layout">
    <div? class="penguin">
        <img src="https://raw.githubusercontent.com/violapajaziti/Waddle---mental-health-tracking/ef81a422f27b2a0457b687579a73ec5dfb972157/image/contact%20penguin.png" alt="Cute penguin" width="100">
   </div>

    <form class="container">
        <h1>Welcome to Waddle</h1>
        <p>Please log in or sign up to continue</p>
        <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br><br>
        
        <a href="#">Forgot password?</a>
        <br><br>
         <button type="submit">Log in</button>
    </form>
    <p>Or</p>
         
            <img src="https://raw.githubusercontent.com/violapajaziti/Waddle---mental-health-tracking/ef81a422f27b2a0457b687579a73ec5dfb972157/image/gmail.png" alt="Google" width="50">
            <img src="https://raw.githubusercontent.com/violapajaziti/Waddle---mental-health-tracking/ef81a422f27b2a0457b687579a73ec5dfb972157/image/instagram.png" alt="Instagram" width="50">
            <img src="https://raw.githubusercontent.com/violapajaziti/Waddle---mental-health-tracking/ef81a422f27b2a0457b687579a73ec5dfb972157/image/pinterest.png" alt="Pinterest" width="50">

         
         <p>
            Don't have an account? 
            <a href="#">Sign up</a></p>
            <h2 id="signup">Create Account</h2>
            <form>
                <label>Name:</label>
                <input type="text" placeholder="Enter your name" required>
                <br><br>
                <label>Password:</label>
                <input type="password" placeholder="Enter your password" required>
                <br><br>
                
                <label>Email:</label>                <input type="email" placeholder="Enter your email" required>
                <br><br>
                <button type="submit">Sign up</button>
            </form>
   </div>
    <script src="Login.js"></script>
  </body>
  
</html>
